name: Build mwd with cross
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_mwinit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp aarch64-android*-lkm/*_mawei.ko ./userspace/mwd/bin/aarch64/
        cp x86_64-android*-lkm/*_mawei.ko ./userspace/mwd/bin/x86_64/
    
    - name: Prepare mwinit
      if: ${{ inputs.pack_mwinit }}
      run: |
        mv mwinit-aarch64/mwinit ./userspace/mwd/bin/aarch64/
        mv mwinit-x86_64/mwinit ./userspace/mwd/bin/x86_64/
        mv mwinit-riscv64/mwinit ./userspace/mwd/bin/riscv64/
        
    - name: Setup rustup
      run: |
        rustup update stable
        if [[ ${{ inputs.target }} == *"-apple-darwin" ]]; then
          rustup target add ${{ inputs.target }}
        fi
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/mwd
        cache-targets: false
        cache-bin: false

    - name: Install cross
      run: |
        RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

    - name: Assemble LKM bootstrap
      run: |
        clang --target=aarch64-linux-gnu -c -nostdlib \
          -o userspace/mwd/.lkm_image_bootstrap.o \
          userspace/mwd/src/lkm_image_bootstrap.S

    - name: Build mwd
      run: CROSS_NO_WARNINGS=0 cross build --target ${{ inputs.target }} --release --manifest-path ./userspace/mwd/Cargo.toml

    - name: Upload mwd artifact
      uses: actions/upload-artifact@v7
      with:
        name: mwd-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/mwd*
